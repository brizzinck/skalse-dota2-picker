<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dota 2 counter picker and item builds based on Dotabuff and OpenDota.">
  <title>Skalse · Dota 2 Picker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0d">
  <meta property="og:title" content="Skalse · Dota 2 Picker">
  <meta property="og:image" content="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="favicon.svg" alt="">
      <div class="brand-text">
        <div class="brand-title"><span class="wordmark">SKALSE</span><span class="brand-tag">Dota 2 Picker</span></div>
        <div class="brand-sub"><span class="data-dot" id="data-dot"></span><span id="data-info" data-i18n="data.loading">loading…</span></div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="seg small" id="lang-switch" role="group" data-i18n-aria="lang.aria">
        <button data-lang="uk">UA</button>
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="seg small" id="source-switch" role="group" data-i18n-aria="source.aria">
        <button data-source="stratz">Stratz</button>
        <button data-source="dotabuff">Dotabuff</button>
        <button data-source="opendota">OpenDota</button>
      </div>
      <button class="btn ghost" id="btn-reset" data-i18n-title="btn.reset.title"><span class="btn-icon" aria-hidden="true">↺</span><span data-i18n="btn.reset">Reset all</span></button>
      <button class="btn" id="btn-share" data-i18n-title="btn.share.title"><span class="btn-icon" aria-hidden="true">⤴</span><span data-i18n="btn.share">Share</span></button>
      <button class="btn ghost icon-only" id="btn-help" data-i18n-title="btn.help.title" data-i18n-aria="btn.help.title">?</button>
    </div>
  </header>

  <main class="layout">
    <!-- Draft -->
    <section class="draft card" id="draft">
      <div class="team team-enemy">
        <div class="team-head">
          <span class="team-label" data-i18n="team.enemy">Enemies</span>
          <button class="side-badge" data-swap></button>
          <span class="team-hint" data-i18n="hint.enemy">left click</span>
          <button class="clear-btn" data-clear="enemy"><span aria-hidden="true">✕</span> <span data-i18n="btn.clear">Clear</span></button>
        </div>
        <div class="slots" id="slots-enemy"></div>
      </div>
      <div class="team team-ally">
        <div class="team-head">
          <span class="team-label" data-i18n="team.ally">Your team</span>
          <button class="side-badge" data-swap></button>
          <span class="team-hint" data-i18n="hint.ally">right click</span>
          <button class="jump-btn" id="jump-builds" data-i18n-title="btn.jump.title" hidden><span data-i18n="btn.jump">Builds ↓</span></button>
          <button class="clear-btn" data-clear="ally"><span aria-hidden="true">✕</span> <span data-i18n="btn.clear">Clear</span></button>
        </div>
        <div class="slots" id="slots-ally"></div>
      </div>
      <div class="team team-ban">
        <div class="team-head">
          <span class="team-label" data-i18n="team.ban">Bans</span>
          <span class="team-hint" data-i18n="hint.ban">Shift + click</span>
          <button class="clear-btn" data-clear="ban"><span aria-hidden="true">✕</span> <span data-i18n="btn.clear">Clear</span></button>
        </div>
        <div class="bans" id="slots-ban"></div>
      </div>
    </section>

    <!-- Hero grid -->
    <section class="pool card" id="heroes">
      <div class="pool-head">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.93 12.09l4.24 4.24-1.41 1.41-4.24-4.24A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <input id="search" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
          <kbd>Enter</kbd>
        </div>
        <div class="seg small" id="pick-mode" role="group" data-i18n-aria="mode.aria">
          <button data-mode="enemy" class="active" aria-pressed="true" data-i18n="mode.enemy">→ Enemies</button>
          <button data-mode="ally" aria-pressed="false" data-i18n="mode.ally">→ Allies</button>
          <button data-mode="ban" aria-pressed="false" data-i18n="mode.ban">→ Ban</button>
        </div>
      </div>
      <div class="pool-grid" id="pool"></div>
    </section>

    <!-- Suggestions -->
    <section class="picks card" id="picks">
      <div class="picks-head">
        <div class="pos-filter" id="pos-filter"></div>
        <div class="picks-toolbar">
          <div class="seg" id="picks-tab" role="group">
            <button data-tab="best" class="active" aria-pressed="true" data-i18n="tab.best">Best picks</button>
            <button data-tab="worst" aria-pressed="false" data-i18n="tab.worst">Worst picks</button>
          </div>
          <button class="opts-btn" id="btn-opts" aria-expanded="false" aria-controls="opts"><span aria-hidden="true">⚙</span><span data-i18n="opts.btn">Filters</span><span class="opts-count" id="opts-count" hidden></span></button>
        </div>
        <div class="chips presets" id="presets"></div>
      </div>
      <div class="picks-scroll" id="picks-scroll">
        <div class="prio crit" id="crit" hidden></div>
        <div class="prio" id="prio" hidden></div>
        <div class="opts" id="opts" hidden></div>
        <div id="picks-body" class="picks-body"></div>
      </div>
    </section>
  </main>

  <!-- Your team's builds -->
  <section class="builds-section" id="builds" hidden>
    <div class="builds-title">
      <h2 data-i18n="builds.title">Your team’s builds</h2>
      <p class="muted" data-i18n="builds.desc"></p>
      <ul class="legend">
        <li><span class="legend-swatch counter"><span class="item-flag">⚑</span></span><span data-i18n="legend.flag"></span></li>
        <li><b class="legend-approx">≈</b><span data-i18n="legend.approx"></span></li>
        <li><span class="team-tag">·</span><span data-i18n="legend.team"></span></li>
        <li class="muted" data-i18n="legend.hover"></li>
      </ul>
    </div>
    <div class="builds-grid" id="builds-body"></div>
  </section>

  <footer class="foot">
    <p data-i18n-html="footer.based"></p>
    <p>
      <button class="link" id="btn-update" data-i18n="footer.update">Update manually</button>
      · <a href="https://github.com/brizzinck/skalse-dota2-picker" data-i18n="footer.source">Source code</a>
    </p>
  </footer>

  <!-- Mobile navigation -->
  <nav class="bottom-nav" aria-label="Sections">
    <a href="#draft"><span aria-hidden="true">⚔</span><span data-i18n="nav.draft">Draft</span></a>
    <a href="#picks"><span aria-hidden="true">★</span><span data-i18n="nav.picks">Picks</span></a>
    <a href="#heroes"><span aria-hidden="true">▦</span><span data-i18n="nav.heroes">Heroes</span></a>
    <a href="#builds" class="nav-builds"><span aria-hidden="true">⛨</span><span data-i18n="nav.builds">Builds</span></a>
  </nav>

  <!-- Help -->
  <dialog id="help-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="help.title">How to use</h2>
      <ul class="help-list">
        <li data-i18n-html="help.1"></li>
        <li data-i18n-html="help.2"></li>
        <li data-i18n-html="help.3"></li>
        <li data-i18n-html="help.4"></li>
        <li data-i18n-html="help.5"></li>
        <li data-i18n-html="help.6"></li>
        <li data-i18n-html="help.7"></li>
      </ul>
      <div class="dialog-actions"><button class="btn" value="close" data-i18n="close">Close</button></div>
    </form>
  </dialog>

  <!-- Manual data update -->
  <dialog id="update-dialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <h2 data-i18n="upd.title">Update Dotabuff data</h2>
      <p data-i18n="upd.p"></p>
      <ol>
        <li data-i18n-html="upd.s1"></li>
        <li data-i18n-html="upd.s2"></li>
        <li data-i18n-html="upd.s3"></li>
        <li data-i18n-html="upd.s4"></li>
      </ol>
      <div class="drop" id="drop-zone">
        <span data-i18n-html="upd.drop"></span>
        <label class="link"><span data-i18n="upd.choose">choose a file</span><input type="file" id="file-input" accept=".js,.json" hidden></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn" id="btn-copy-script" data-i18n="upd.copy">Copy script</button>
        <button type="button" class="btn ghost" id="btn-forget" data-i18n="upd.forget" data-i18n-title="upd.forget.title">Reset import</button>
        <button class="btn ghost" value="close" data-i18n="close">Close</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-msg"></span>
    <button class="toast-action" type="button" hidden></button>
  </div>

  <!-- Scripts are loaded with a time-based version (changes every 10 minutes) so browsers
       don't keep an old copy after the site is updated. Order matters. -->
  <script>
    (function () {
      var v = location.protocol.indexOf('http') === 0 ? '?v=' + Math.floor(Date.now() / 6e5) : '';
      var css = document.querySelector('link[href="styles.css"]');
      if (css && v) css.href = 'styles.css' + v;
      ['i18n.js', 'scraper.js', 'knowledge.js', 'builds.js', 'app.js'].reduce(function (prev, src) {
        return prev.then(function () {
          return new Promise(function (resolve) {
            var s = document.createElement('script');
            s.src = src + v;
            s.onload = s.onerror = resolve;
            document.body.appendChild(s);
          });
        });
      }, Promise.resolve());
    })();
  </script>
</body>
</html>
