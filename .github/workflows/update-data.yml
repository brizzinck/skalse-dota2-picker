name: Update data & deploy

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # site changes are published right away (no data collection)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub-hosted maximum
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dotabuff: Cloudflare blocks GitHub's datacenter IPs, so Chrome goes through a proxy.
      # Skipped when the DOTABUFF_PROXY variable is not set; a failure keeps the old data.js.
      - name: Collect Dotabuff
        env:
          DOTABUFF_PROXY: ${{ secrets.DOTABUFF_PROXY || vars.DOTABUFF_PROXY }}
          DOTABUFF_PROXY_USER: ${{ secrets.DOTABUFF_PROXY_USER || vars.DOTABUFF_PROXY_USER }}
          DOTABUFF_PROXY_COUNTRIES: ${{ secrets.DOTABUFF_PROXY_COUNTRIES || vars.DOTABUFF_PROXY_COUNTRIES }}
          DOTABUFF_PROXY_PASS: ${{ secrets.DOTABUFF_PROXY_PASS || vars.DOTABUFF_PROXY_PASS }}
        continue-on-error: true
        run: |
          for v in DOTABUFF_PROXY DOTABUFF_PROXY_USER DOTABUFF_PROXY_COUNTRIES DOTABUFF_PROXY_PASS; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: NOT SET"; fi
          done
          if [ -z "$DOTABUFF_PROXY" ]; then echo 'No proxy configured, skipping Dotabuff'; exit 0; fi
          npm i --no-save patchright playwright
          xvfb-run -a node scripts/update-data.mjs

      # Stratz: plain API requests, no browser.
      - name: Collect Stratz
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ || vars.STRATZ }}
        if: env.STRATZ_TOKEN != ''
        continue-on-error: true   # one source failing must not stop the other's data from being committed
        run: node scripts/stratz.mjs

      - name: Commit data
        run: |
          git config user.name 'lavrishkovlad'
          git config user.email 'lavrishkovlad@gmail.com'
          git add data.js stratz.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Data unchanged'
          else
            git commit -m "Update data $(date -u +%F)"
            git pull --rebase
            git push
          fi

  deploy:
    needs: update
    # publish even if collection failed — the site keeps the last good data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the fresh commit with the new data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
