name: Update data & deploy

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # site changes are published right away (no data collection)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Stratz: plain API requests, no browser — the main source of fresh data.
      # Dotabuff is NOT collected here: Cloudflare blocks browsers on GitHub's datacenter IPs.
      # It is collected on a home PC instead (update-data.ps1 -Push, scheduled by install-autoupdate.ps1);
      # scripts/update-data.mjs can still be run manually on any machine with Node and Chrome.
      - name: Collect Stratz
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ || vars.STRATZ }}
        if: env.STRATZ_TOKEN != ''
        run: node scripts/stratz.mjs

      - name: Commit data
        run: |
          git config user.name 'lavrishkovlad'
          git config user.email 'lavrishkovlad@gmail.com'
          git add data.js stratz.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Data unchanged'
          else
            git commit -m "Update Stratz data $(date -u +%F)"
            git pull --rebase
            git push
          fi

  deploy:
    needs: update
    # publish even if collection failed — the site keeps the last good data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the fresh commit with the new data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
