<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset=".55" stop-color="#e5b453"/>
      <stop offset="1" stop-color="#b9821f"/>
    </linearGradient>
    <linearGradient id="enemy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1416"/>
      <stop offset="1" stop-color="#160c10"/>
    </linearGradient>
    <linearGradient id="ally" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a15"/>
      <stop offset="1" stop-color="#0f2a20"/>
    </linearGradient>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- enemies (top-left) vs your team (bottom-right) -->
    <rect width="64" height="64" fill="url(#ally)"/>
    <path d="M0 0 H64 L0 64 Z" fill="url(#enemy)"/>
    <path d="M64 0 L0 64" stroke="#000" stroke-opacity=".35" stroke-width="1.5"/>
  </g>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- the S -->
  <path d="M45 15 H25 Q17 15 17 23 V26 Q17 33 25 33 H39 Q47 33 47 40 V43 Q47 50 39 50 H18"
        fill="none" stroke="#000" stroke-opacity=".45" stroke-width="9" stroke-linejoin="round" transform="translate(1 1.5)"/>
  <path d="M45 15 H25 Q17 15 17 23 V26 Q17 33 25 33 H39 Q47 33 47 40 V43 Q47 50 39 50 H18"
        fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="13" cy="13" r="2.2" fill="#ec5b52"/>
  <circle cx="51" cy="51" r="2.2" fill="#43bf92"/>
</svg>
